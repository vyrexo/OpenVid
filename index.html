<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVid - Video Feed</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="res/icon.ico" type="image/x-icon">
</head>
<body>
<header class="header">
  <div class="wrap header-in">
    <a class="logo" href="index.html">
      <span>OpenVid</span>
    </a>
    <div class="header-actions">
      <div class="dropdown-wrap">
        <button id="settings-toggle" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false"><img src="res/settings.webp" alt="Settings" width="24" height="24"></button>
        <div id="settings-menu" class="dropdown-menu" role="menu" style="display:none">
          <button class="dropdown-item" data-lang="en" role="menuitem" id="lang-en">English</button>
          <button class="dropdown-item" data-lang="ru" role="menuitem" id="lang-ru">Русский</button>
        </div>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme"><img src="res/theme.webp" alt="Theme" width="24" height="24"></button>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#999" stroke-width="2"/><line x1="11" y1="11" x2="15" y2="15" stroke="#999" stroke-width="2"/></svg>
      <input id="search" type="text" placeholder="Search by title..." autocomplete="off">
    </div>
  </div>
</header>
<main class="wrap">
  <h1 class="page-title" id="page-title">Video Feed</h1>
  <div id="grid" class="grid">
    <noscript><p>Enable JavaScript to see videos.</p></noscript>
  </div>
  <p id="empty" class="empty" style="display:none">Nothing found. Try another query.</p>
  <div id="pagination" class="pagination" style="display:none"></div>
</main>
<footer class="footer">
  <div class="wrap">
    <p>OpenVid</p>
  </div>
</footer>
<div id="modal" class="modal" style="display:none">
  <div class="modal-overlay"></div>
  <div class="modal-box">
    <div class="modal-head">
      <b id="modal-title">Video title</b>
    </div>
    <div id="player-wrap" class="player-wrap"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
